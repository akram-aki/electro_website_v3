name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Ensure all branches are fetched

      - name: Set Up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream & Fetch Changes
        run: |
          git remote add upstream https://github.com/original-owner/original-repo.git
          git fetch upstream --prune

      - name: Sync All Branches
        run: |
          for branch in $(git branch -r | grep 'upstream/' | sed 's/upstream\///'); do
            echo "Syncing branch: $branch"
            git checkout $branch || git checkout -b $branch upstream/$branch
            git merge upstream/$branch --allow-unrelated-histories || echo "No changes to merge"
            git push origin $branch
          done
